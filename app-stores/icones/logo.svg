    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#3a0b3f" flood-opacity=".28"/></filter>
  </defs>
  <rect id="carre" width="1024" height="1024" fill="url(#fond)"/>
