      <rect x="262" y="728" width="60" height="44" rx="12"/><rect x="362" y="728" width="60" height="44" rx="12"/><rect x="462" y="728" width="60" height="44" rx="12"/><rect x="562" y="728" width="60" height="44" rx="12"/><rect x="662" y="728" width="60" height="44" rx="12"/>
    </g>
