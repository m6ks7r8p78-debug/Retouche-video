name: NOVA - H264 720p real output OPFS pilot
on:
  push:
    branches:
      - chatgpt-nova-hd720-output-pilot-v1-20261115
  pull_request:
    branches:
      - chatgpt-nova-opfs-recovery-diagnostics-v1-20261115
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-hd720-output-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe des nouveaux profils et de l'interface
        run: |
          node --check experiences/nova-color709.js
          node --check experiences/nova-export.js
          node --check experiences/nova-export-meter.js
          node --check experiences/nova-h264-path.js
          node --check experiences/nova-real-preflight.js
          node --check experiences/nova-real-preflight-ui.js
          node --check experiences/nova-export-ui.js
          node --check tests/nova-hd720-output-browser.test.mjs
      - name: Tests 720p, couleur, AAC, ancien 640, OPFS 48s
        run: |
          node --test tests/nova-hd720-output-pilot.test.mjs tests/nova-color709.test.mjs tests/nova-export-meter.test.mjs tests/nova-export.test.mjs tests/nova-h264-path.test.mjs tests/nova-real-preflight.test.mjs tests/nova-opfs-stream.test.mjs tests/nova-opfs-recovery.test.mjs tests/nova-local-export-report.test.mjs tests/nova-muxer-24s.test.mjs tests/nova-aac-copy.test.mjs tests/nova-windows.test.mjs tests/nova-avc-vui.test.mjs tests/nova-hevc-refusal-diagnostic.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright sur Chromium CI
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - name: Vérifier ffmpeg ffprobe x264
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: 720p réel, ancien 640p, OPFS 20 24 36 48s et AAC SHA256
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME"
          node --test tests/nova-hd720-output-browser.test.mjs tests/nova-hd720-color-av-browser.test.mjs tests/nova-opfs-stream-browser.test.mjs tests/nova-h264-windowed-long-browser.test.mjs
