name: Directeur IA - tests de branche
on:
  push:
    branches: [chatgpt-ai-director-v01]
  workflow_dispatch:

concurrency:
  group: directeur-ia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer la branche
        uses: actions/checkout@v4
      - name: Verifier le mecanisme de reprise
        run: |
          node --check outils/directeur-reprise.cjs
          node --test tests/directeur-reprise.test.mjs
          node outils/directeur-reprise.cjs inspecter
      - name: Verifier le code JS
        run: |
          node --check directeur-ia.js
          node --check directeur-qualite.js
          node --check directeur-scenes.js
          node --check directeur-capacites.js
          node --check directeur-rendu.js
          node --check directeur-export.js
          node --check outils/directeur-laboratoire.cjs
          node --check app.js
          node --check sw.js
      - name: Tests du Directeur IA
        run: node --test tests/directeur-ia.test.mjs tests/directeur-qualite.test.mjs tests/directeur-scenes.test.mjs tests/directeur-capacites.test.mjs tests/directeur-rendu.test.mjs tests/directeur-export.test.mjs
      - name: Laboratoire d'autonomie et garde-fous de recherche
        run: |
          node --test tests/directeur-laboratoire.test.mjs
          node -e "const p=require('./outils/directeur-laboratoire.cjs').experimenter(); console.log(JSON.stringify({etat:p.etat,train:p.nombreCasTrain,validation:p.nombreCasValidation,hypotheses:p.hypothesesEvaluees,gainValidation:p.gainValidation,aucunDeploiementAutomatique:p.aucunDeploiementAutomatique}))"
      - name: Contrôle de non-régression du reformatage v8.0
        run: node --test tests/format.test.mjs
      - name: Afficher l empreinte PWA attendue et verifier le cache
        run: |
          node tests/directeur-empreinte.mjs
          node tests/sw.test.mjs
      - name: Capturer le resultat et les prochaines etapes (meme si test echoue)
        if: ${{ always() }}
        env:
          JOB_RESULT: ${{ job.status }}
        run: node outils/directeur-reprise.cjs capture --out .ci-checkpoint/tests.json
      - name: Conserver le checkpoint CI du job tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: directeur-reprise-tests-${{ github.run_attempt }}
          path: .ci-checkpoint/tests.json
          if-no-files-found: warn
          retention-days: 30

  parcours-navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le code expérimental
        uses: actions/checkout@v4
      - name: Installer Playwright sans télécharger un autre Chrome
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Installer FFmpeg pour générer et vérifier les vidéos de test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Vérifier le parcours complet photo et vidéo
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Navigateur utilisé : $CHROME"
          test -x "$CHROME"
          node --test tests/directeur-browser.test.mjs
      - name: Démontrer l'encodage 8K hors navigateur avec audio
        run: node --test tests/directeur-8k.test.mjs
      - name: Capturer le resultat et les prochaines etapes (meme si test echoue)
        if: ${{ always() }}
        env:
          JOB_RESULT: ${{ job.status }}
        run: node outils/directeur-reprise.cjs capture --out .ci-checkpoint/parcours-navigateur.json
      - name: Conserver le checkpoint CI du job navigateur
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: directeur-reprise-parcours-navigateur-${{ github.run_attempt }}
          path: .ci-checkpoint/parcours-navigateur.json
          if-no-files-found: warn
          retention-days: 30
