# Construit les apps RetoucheProAI pour Google Play et l'App Store, dans le cloud (aucun Mac nécessaire).
# - à chaque changement de l'app : vérifie que les deux apps compilent (Android : APK d'essai ; iPhone : simulateur) ;
# - lancement manuel « publier » : fichiers signés prêts pour les stores, si les secrets sont en place (voir app-stores/README.md).
name: Apps des stores
on:
  push:
    branches: [main]
    paths: ["app-stores/**", "*.html", "*.js", "sr.bin", ".github/workflows/apps-stores.yml"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Construire les versions signées pour les stores"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: apps-stores-${{ github.ref }}
  cancel-in-progress: true
env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: "1.0.${{ github.run_number }}"
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-stores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node preparer-web.mjs && npx cap sync android
      - name: APK d'essai
        if: ${{ !inputs.publier }}
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Version signée pour Google Play (AAB)
        if: ${{ inputs.publier }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::secret ANDROID_KEYSTORE_BASE64 manquant (voir app-stores/README.md)"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app-stores/android/app/build/outputs/apk/debug/*.apk
            app-stores/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app-stores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node preparer-web.mjs && npx cap sync ios
      - name: Compilation de contrôle (simulateur, sans signature)
        if: ${{ !inputs.publier }}
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Version signée pour l'App Store (envoi vers TestFlight)
        if: ${{ inputs.publier }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "::error::secrets App Store Connect manquants (voir app-stores/README.md)"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys && echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$VERSION_CODE MARKETING_VERSION=$VERSION_NAME $AUTH archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string><key>teamID</key><string>$APPLE_TEAM_ID</string></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -20
