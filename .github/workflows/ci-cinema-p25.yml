name: Cinema P25 — H264 CRF quality and size matrix
on:
  push:
    paths:
      - 'studio-cinema/p25/**'
      - '.github/workflows/ci-cinema-p25.yml'
  pull_request:
    paths:
      - 'studio-cinema/p25/**'
      - '.github/workflows/ci-cinema-p25.yml'
  workflow_dispatch:
jobs:
  three-profile-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated free vector-processing dependencies
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'opencv-python-headless>=4.9,<5'
      - name: Install FFmpeg when missing and validate codecs
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep 'libx264'
          ffmpeg -hide_banner -encoders | grep -E '(^| )aac( |$)'
          ffmpeg -hide_banner -encoders | grep 'ffv1'
      - name: Generate only authentic 480 fictional P19/P21 frames
        run: node studio-cinema/p22/src/build_p22_controls.cjs studio-cinema/p22/results/controls.json
      - name: Verify original P15-P24 tests and new P25 adversarial contracts
        run: |
          node --test studio-cinema/p21/tests/test_p21.cjs studio-cinema/p20/tests/test_p20.cjs studio-cinema/p19/tests/test_p19.cjs studio-cinema/p15/tests/test_behavior_ontology.cjs
          python -m unittest discover -s studio-cinema/p22/tests -p 'test_p22_visual.py' -v
          python -m unittest discover -s studio-cinema/p23/tests -p 'test_p23_temporal.py' -v
          python -m unittest discover -s studio-cinema/p24/tests -p 'test_p24_unit.py' -v
          python -m unittest discover -s studio-cinema/p24/tests -p 'test_p24_browser_static.py' -v
          python -m unittest discover -s studio-cinema/p25/tests -p 'test_p25_contracts.py' -v
      - name: Build verified lossless masters, encode three synthetic CRF tiers and audit decoded video
        run: |
          python studio-cinema/p25/src/p25_crf_matrix.py             --data studio-cinema/p22/results/controls.json             --out studio-cinema/p25/results/proof
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('studio-cinema/p25/results/proof/p25_crf_matrix_synthetic_report.json').read_text())
          assert report['status']=='synthetic_matrix_measured',report
          assert report['crfs_compared']==[18,25,32]
          assert report['frame_count']==480
          assert report['lossless_master_BRG_roundtrip_samples_checked']=={'p19':7,'p23':7}
          assert len(report['profiles'])==3
          for item in report['profiles']:
              assert item['decoded_frames']==480 and item['temporal_transitions']==479,item
              assert item['p23_video_info']['aac_synthetic'] is True,item
              assert item['p19_video_info']['aac_synthetic'] is False,item
              assert len(item['peak_results'])==4,item
              assert item['status'] in ['synthetic_profile_measured','human_review_required_signal_lost']
          assert report['no_real_users_or_private_media'] is True
          assert report['iphone_safari_physically_tested'] is False
          assert report['best_profile_for_users_certified'] is False
          print('P25 isolated H264 decoded CRF matrix measured: 18,25,32; no automatic recommendation')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-p25-h264-3profile-synthetic-proof
          path: |
            studio-cinema/p25/results/proof/p25_crf_matrix_synthetic_report.json
            studio-cinema/p25/results/proof/P25_CRF*_synthetic_H264_AAC.mp4
          if-no-files-found: error
          retention-days: 3
