name: NOVA real video - preflight local sans export
on:
  push:
    branches:
      - chatgpt-nova-real-video-preflight-v1
  pull_request:
    branches:
      - chatgpt-nova-iphone-https-package-v1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-real-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe des modules
        run: |
          node --check experiences/nova-real-preflight.js
          node --check experiences/nova-real-preflight-ui.js
          node --check tests/nova-real-preflight.test.mjs
          node --check tests/nova-real-preflight-browser.test.mjs
      - name: FFmpeg pour mires synthétiques
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Tests unitaires du précontrôle et non-régression NOVA
        run: |
          node --test tests/nova-real-preflight.test.mjs tests/nova-iphone-preview.test.mjs tests/nova-iphone-report.test.mjs tests/nova-smallmotion-bridge.test.mjs
      - name: Construire un paquet Cloudflare Pages isolé
        run: |
          node outils/build-nova-iphone-preview.mjs
          test -f dist/nova-iphone-preview/_headers
          test -f dist/nova-iphone-preview/experiences/nova-real-preflight.js
          test -f dist/nova-iphone-preview/experiences/nova-real-preflight-ui.js
      - name: ZIP indépendant à déposer manuellement sur Pages
        run: |
          cd dist/nova-iphone-preview
          zip -q -X -r ../../NOVA_real_video_preflight_Cloudflare.zip .
          cd ../..
          unzip -t NOVA_real_video_preflight_Cloudflare.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-real-video-preflight-Cloudflare
          path: NOVA_real_video_preflight_Cloudflare.zip
          retention-days: 7
          if-no-files-found: error
  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - name: Installer FFmpeg si absent
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Vérifier HEVC/AAC positif puis rejet H264 sous CSP sans upload
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME"
          node --test tests/nova-real-preflight-browser.test.mjs
