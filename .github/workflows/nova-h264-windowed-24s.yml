name: NOVA - H264 24s fenetres et AAC continu (labo)
on:
  push:
    branches:
      - chatgpt-nova-h264-windowed-24s-v1-20261115
  pull_request:
    branches:
      - chatgpt-nova-hd720-color-av-v1-20261115
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-24s-windowed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe des modules et tests unitaires NOVA
        run: |
          node --check experiences/nova-windows.js
          node --check experiences/nova-export.js
          node --check experiences/nova-export-ui.js
          node --check experiences/nova-real-preflight.js
          node --check experiences/nova-h264-path.js
          node --check tests/nova-h264-windowed-long-browser.test.mjs
          node --check mp4-muxer.js
          node --check tests/nova-muxer-24s.test.mjs
          node --test tests/nova-muxer-24s.test.mjs tests/nova-windows.test.mjs tests/nova-export.test.mjs tests/nova-h264-path.test.mjs tests/nova-avc-vui.test.mjs tests/nova-hevc-refusal-diagnostic.test.mjs tests/nova-real-preflight.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright pour Chromium du runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - name: Vérifier FFmpeg, FFprobe et encodeur x264
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Vrai MP4 de 20 secondes avec 4 fenetres et AAC integral
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME"
          node --test tests/nova-h264-windowed-long-browser.test.mjs tests/nova-hd720-color-av-browser.test.mjs
