jobs:
  scenario-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe du code de l’interface v0.19
        run: node --check studio-3d/film-ui-v19.mjs && node --check studio-3d/film-finger-mesh-v19.mjs && node --check studio-3d/film-handgrip-v18.mjs
      - name: Verifier le contrat de scenario sans medias prives
        run: node --test studio-3d/film-project-v01.test.mjs studio-3d/film-preview-v01.test.mjs studio-3d/film-sequence-v02.test.mjs studio-3d/film-ui-v02.test.mjs studio-3d/film-viewer-v03.test.mjs studio-3d/film-ui-v03.test.mjs studio-3d/film-contact-v03.test.mjs studio-3d/film-webgl-v04.test.mjs studio-3d/film-diagnostic-v06.test.mjs studio-3d/film-share-v07.test.mjs studio-3d/film-motion-v08.test.mjs studio-3d/film-fingers-v09.test.mjs studio-3d/film-inspection-v10.test.mjs studio-3d/film-grip-v11.test.mjs studio-3d/film-volume-v12.test.mjs studio-3d/film-bridge-v13.test.mjs studio-3d/film-continuous-v14.test.mjs studio-3d/film-morph-v15.test.mjs studio-3d/film-actions-v16.test.mjs studio-3d/film-ik-v17.test.mjs studio-3d/film-handgrip-v18.test.mjs studio-3d/film-finger-mesh-v19.test.mjs

  navigateur-webgl2:
    needs: scenario-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le banc Playwright sur le runner temporaire
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium
      - name: Vérifier la page complète, les pixels WebGL2, les gestes et le refus
        run: node studio-3d/film-browser-v19.test.mjs
      - name: Conserver la capture synthétique pour revue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-studio-v19-chromium-synthetic
          path: test-results/film-studio-v19-chromium*.png
          if-no-files-found: ignore
          retention-days: 7

  navigateur-webkit:
    needs: scenario-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright sur runner temporaire
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Installer WebKit et ses dépendances système
        run: npx playwright install --with-deps webkit
      - name: Tester Safari WebKit simulé, mode tactile, repli et export local
        run: node studio-3d/film-browser-webkit-v19.test.mjs
      - name: Archiver captures entièrement synthétiques WebKit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-studio-v19-webkit-synthetic
          path: test-results/film-studio-v19-webkit-*.png
          if-no-files-found: ignore
          retention-days: 7

  paquet-iphone-isole:
    needs: [scenario-contract, navigateur-webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Préparer un paquet statique sans médias ni données privées
        run: |
          mkdir -p dist/film-studio-iphone-v19
          cp studio-3d/film-studio-v19.html dist/film-studio-iphone-v19/index.html
          for name in \
            generateur.js \
            film-ui-v19.mjs film-finger-mesh-v19.mjs film-handgrip-v18.mjs film-ik-v17.mjs film-action-plan-v16.mjs film-actions-v16.mjs film-morph-v15.mjs film-continuous-v14.mjs film-bridge-v13.mjs film-volume-v12.mjs film-grip-v11.mjs film-scene-v10.mjs film-inspection-v10.mjs film-fingers-v09.mjs film-motion-v08.mjs film-share-v19.mjs film-diagnostic-v06.mjs \
            film-contact-v03.mjs film-sequence-v02.mjs \
            film-project-v01.mjs film-viewer-v03.mjs film-webgl-v04.mjs; do
            cp "studio-3d/$name" "dist/film-studio-iphone-v19/$name"
          done
          cat > dist/film-studio-iphone-v19/_headers <<'HEADERS'
          /*
            Cache-Control: no-store
            Referrer-Policy: no-referrer
            X-Content-Type-Options: nosniff
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            Content-Security-Policy: default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'
          HEADERS
          test "$(find dist/film-studio-iphone-v19 -maxdepth 1 -type f | wc -l)" -eq 25
          test -z "$(find dist/film-studio-iphone-v19 -type f \( -name '*.mp4' -o -name '*.jpg' -o -name '*.png' \))"
      - name: Préparer le téléchargement du paquet de laboratoire iPhone
        uses: actions/upload-artifact@v4
        with:
          name: film-studio-v19-iphone-https-package
          path: dist/film-studio-iphone-v19/
          retention-days: 14
          if-no-files-found: error
