name: Film Studio - scenario et aperçu local v0.3
on:
  push:
    branches:
      - chatgpt-film-studio-contract-v01-20261115
  pull_request:
    paths:
      - 'studio-3d/film-project-v01.mjs'
      - 'studio-3d/film-project-v01.test.mjs'
      - 'studio-3d/film-preview-v01.mjs'
      - 'studio-3d/film-preview-v01.test.mjs'
      - 'studio-3d/film-sequence-v02.mjs'
      - 'studio-3d/film-sequence-v02.test.mjs'
      - 'studio-3d/film-ui-v02.mjs'
      - 'studio-3d/film-ui-v02.test.mjs'
      - 'studio-3d/film-studio-v02.html'
      - 'studio-3d/film-contact-v03.mjs'
      - 'studio-3d/film-contact-v03.test.mjs'
      - 'studio-3d/film-viewer-v03.mjs'
      - 'studio-3d/film-viewer-v03.test.mjs'
      - 'studio-3d/film-ui-v03.mjs'
      - 'studio-3d/film-ui-v03.test.mjs'
      - 'studio-3d/film-studio-v03.html'
      - '.github/workflows/ci-film-studio-v01.yml'
jobs:
  scenario-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier le contrat de scenario sans medias prives
        run: node --test studio-3d/film-project-v01.test.mjs studio-3d/film-preview-v01.test.mjs studio-3d/film-sequence-v02.test.mjs studio-3d/film-ui-v02.test.mjs studio-3d/film-viewer-v03.test.mjs studio-3d/film-ui-v03.test.mjs studio-3d/film-contact-v03.test.mjs
