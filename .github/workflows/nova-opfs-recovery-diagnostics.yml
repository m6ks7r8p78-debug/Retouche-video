name: NOVA - OPFS recovery and local iPhone diagnostics
on:
  push:
    branches:
      - chatgpt-nova-opfs-recovery-diagnostics-v1-20261115
  pull_request:
    branches:
      - chatgpt-nova-opfs-48s-av-v1-20261115
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-recovery-diagnostics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe et protection des informations privées
        run: |
          node --check experiences/nova-opfs-recovery.js
          node --check experiences/nova-opfs-recovery-ui.js
          node --check experiences/nova-local-export-report.js
          node --check experiences/nova-export-ui.js
          node --check experiences/nova-opfs-stream.js
          node --check tests/nova-opfs-stream-browser.test.mjs
      - name: Contrôles hérités et nouveaux tests locaux
        run: |
          node --test tests/nova-opfs-recovery.test.mjs tests/nova-local-export-report.test.mjs tests/nova-opfs-stream.test.mjs tests/nova-muxer-24s.test.mjs tests/nova-aac-copy.test.mjs tests/nova-windows.test.mjs tests/nova-export.test.mjs tests/nova-h264-path.test.mjs tests/nova-avc-vui.test.mjs tests/nova-hevc-refusal-diagnostic.test.mjs tests/nova-real-preflight.test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright Chromium
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - name: FFmpeg et FFprobe seulement sur mires synthétiques
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: MP4 20 24 36 48 secondes OPFS plus diagnostics et suppression ciblée
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME"
          node --test tests/nova-opfs-stream-browser.test.mjs tests/nova-h264-windowed-long-browser.test.mjs
