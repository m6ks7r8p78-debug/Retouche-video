name: Retouche 3D — PWA safe update, two open clients
on:
  push:
    branches:
      - lab-3d-smallmotion-pwa-safe-update-v1
    paths:
      - 'sw.js'
      - 'research/3d-smallmotion/**'
      - '.github/workflows/retouche-pwa-safe-update.yml'
  pull_request:
    paths:
      - 'sw.js'
      - 'research/3d-smallmotion/**'
      - '.github/workflows/retouche-pwa-safe-update.yml'
jobs:
  active-client-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: research/3d-camera-v43:research/3d-multimotion:research/3d-depth-evidence:research/3d-smallmotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact SW full-manifest SHA-256 and no accidental changes
        run: |
          node tests/sw.test.mjs --maj
          git diff --exit-code -- sw.js
          node tests/sw.test.mjs
          node research/3d-smallmotion/tests/test_pwa_manifest.cjs
      - name: Cache installation atomicity, no skipWaiting and active editors
        run: |
          node research/3d-smallmotion/tests/test_sw_atomic.cjs
          node research/3d-smallmotion/tests/test_sw_update_policy.cjs
      - name: Install CPU-only test tooling
        run: python -m pip install numpy opencv-python-headless pytest playwright
      - name: Ensure Chromium for same-origin offline tests
        run: |
          if ! command -v chromium >/dev/null && ! command -v google-chrome >/dev/null && ! command -v chromium-browser >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: 139 inherited Python regressions
        run: python -m pytest -q research/3d-camera-v43/tests research/3d-multimotion/tests research/3d-depth-evidence/tests research/3d-smallmotion/tests/test_smallmotion.py
      - name: Keep original Worker consistency and budget tests
        run: |
          node research/3d-smallmotion/tests/test_smallmotion_local.cjs
          node research/3d-smallmotion/tests/test_worker_runner.cjs
          node research/3d-smallmotion/tests/test_worker_import.cjs
          node research/3d-smallmotion/tests/test_resource_guard.cjs
          node research/3d-smallmotion/tests/test_director_local.cjs
      - name: Old PWA scenario — real offline restart and worker import
        run: python research/3d-smallmotion/tests/test_pwa_offline.py
      - name: NEW real PWA scenario — two open editors, full precache, new release, network cut
        run: python research/3d-smallmotion/tests/test_pwa_update_two_clients.py
      - name: Archive only synthetic lifecycle measurements
        uses: actions/upload-artifact@v4
        with:
          name: smallmotion-pwa-safe-update-synthetic
          path: |
            research/3d-smallmotion/results/pwa_update_two_clients.json
            research/3d-smallmotion/results/pwa_offline_chromium.json
          if-no-files-found: error
