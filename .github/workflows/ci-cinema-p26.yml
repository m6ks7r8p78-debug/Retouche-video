name: Cinema P26 — nine H264 second-generation re-encodes
on:
  push:
    paths:
      - 'studio-cinema/p26/**'
      - '.github/workflows/ci-cinema-p26.yml'
  pull_request:
    paths:
      - 'studio-cinema/p26/**'
      - '.github/workflows/ci-cinema-p26.yml'
  workflow_dispatch:
jobs:
  synthetic-double-encoding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible free P19-P26 source-processing dependencies
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'opencv-python-headless>=4.9,<5'
      - name: Install free FFmpeg H264, AAC and FFV1 encoders
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -encoders | grep -E '(^| )aac( |$)'
          ffmpeg -hide_banner -encoders | grep ffv1
      - name: Generate real procedural P19-P21 controls for 480 frames
        run: node studio-cinema/p22/src/build_p22_controls.cjs studio-cinema/p22/results/controls.json
      - name: Run all P15-P26 source and adversarial tests
        run: |
          node --test studio-cinema/p21/tests/test_p21.cjs studio-cinema/p20/tests/test_p20.cjs studio-cinema/p19/tests/test_p19.cjs studio-cinema/p15/tests/test_behavior_ontology.cjs
          python -m unittest discover -s studio-cinema/p22/tests -p 'test_p22_visual.py' -v
          python -m unittest discover -s studio-cinema/p23/tests -p 'test_p23_temporal.py' -v
          python -m unittest discover -s studio-cinema/p24/tests -p 'test_p24_unit.py' -v
          python -m unittest discover -s studio-cinema/p24/tests -p 'test_p24_browser_static.py' -v
          python -m unittest discover -s studio-cinema/p25/tests -p 'test_p25_contracts.py' -v
          python -m unittest discover -s studio-cinema/p26/tests -p 'test_p26_contracts.py' -v
      - name: Build complete P25 CRF 18-25-32 first-generation synthetic originals
        run: |
          python studio-cinema/p25/src/p25_crf_matrix.py             --data studio-cinema/p22/results/controls.json             --out studio-cinema/p25/results/proof
      - name: Run nine second-generation H264 transcodes with unchanged AAC
        run: |
          python studio-cinema/p26/src/p26_recompression.py             --data studio-cinema/p22/results/controls.json             --source-dir studio-cinema/p25/results/proof             --out studio-cinema/p26/results/proof
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('studio-cinema/p26/results/proof/p26_second_generation_synthetic_report.json').read_text())
          assert r['status']=='synthetic_second_generation_measured'
          assert r['video_stream_comparisons']==9
          assert len(r['summary'])==9
          assert r['second_generation_audio_preserved'] is True
          assert r['no_universal_crf_choice'] is True
          assert r['physical_iphone_safari_tested'] is False
          assert r['no_automatic_app_integration'] is True
          for row in r['summary']:
              assert row['frames_compared']==480 and row['transitions_compared']==479
              assert row['audio_pcm_digest_equal'] is True
              assert len(row['gesture_peak_comparisons'])==4
              assert row['first_metadata']['aac_synthetic'] is True
              assert row['second_metadata']['aac_synthetic'] is True
          print('P26 verified 9 second-generation synthetic H264/AAC files; no user media')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-p26-second-generation-synthetic-proof
          path: |
            studio-cinema/p26/results/proof/p26_second_generation_synthetic_report.json
            studio-cinema/p26/results/proof/P26_pass2_25_to_32_synthetic_H264_AAC.mp4
          retention-days: 3
          if-no-files-found: error
