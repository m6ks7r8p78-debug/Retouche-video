name: Vidéo neuronale — export MP4 réel de bout en bout
on:
  pull_request:
    paths:
      - 'app.js'
      - 'mode-simple.js'
      - 'sr.js'
      - 'sr-gpu.js'
      - 'iak.js'
      - 'tests/v11_restauration_mp4_ia.test.mjs'
      - '.github/workflows/ia-video-minimal.yml'
jobs:
  neural-mp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer court clip synthétique très compressé, avec audio AAC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/medias
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=128x72:rate=5 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 -t 0.7 \
            -c:v libx264 -crf 37 -pix_fmt yuv420p -c:a aac -b:a 64k -shortest \
            -movflags +faststart tests/medias/video_vieuxtel.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -of csv=p=0 tests/medias/video_vieuxtel.mp4
      - name: Préparer Chrome et Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/rpa-neural" playwright@1.56.1
          if ! command -v google-chrome >/dev/null 2>&1; then "$RUNNER_TEMP/rpa-neural/node_modules/.bin/playwright" install --with-deps chrome; fi
          echo "PW=$RUNNER_TEMP/rpa-neural/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Vidéo encodée avec le vrai réseau neuronal + son
        shell: bash
        run: |
          set -euo pipefail
          node tests/v11_restauration_mp4_ia.test.mjs