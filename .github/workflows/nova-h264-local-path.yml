name: NOVA - H264 PTS/AAC chemin local (expérimental)
on:
  push:
    branches:
      - chatgpt-nova-h264-local-path-v1-20261115
  pull_request:
    branches:
      - chatgpt-nova-hevc-diagnostic-cause-v1-20261115
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-h264-av-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier syntaxe et tests du nouveau chemin + héritage
        run: |
          node --check experiences/nova-h264-path.js
          node --check experiences/nova-real-preflight.js
          node --check experiences/nova-real-preflight-ui.js
          node --test tests/nova-h264-path.test.mjs tests/nova-hevc-refusal-diagnostic.test.mjs tests/nova-real-preflight.test.mjs
      - name: FFmpeg requis pour la mire, sans média externe
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Générer le paquet et vérifier la mire H264/AAC
        run: |
          node outils/build-nova-iphone-preview.mjs
          test -s dist/nova-iphone-preview/experiences/nova-h264-path.js
          test -s dist/nova-iphone-preview/experiences/nova-h264-aac-synthetic.mp4
          ffprobe -v error -show_entries stream=codec_name -of default=noprint_wrappers=1 dist/nova-iphone-preview/experiences/nova-h264-aac-synthetic.mp4 | tee /tmp/nova-h264-aac-codecs.txt
          grep -q 'codec_name=h264' /tmp/nova-h264-aac-codecs.txt
          grep -q 'codec_name=aac' /tmp/nova-h264-aac-codecs.txt
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - name: Installer FFmpeg si absent
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Chrome sous CSP + export AV synthétique + comparaison paquets AAC
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME"
          node --test tests/nova-real-preflight-browser.test.mjs tests/nova-h264-export-browser.test.mjs
