name: Cinema P24 — decoded H264 temporal evidence
on:
  push:
    paths:
      - 'studio-cinema/p24/**'
      - '.github/workflows/ci-cinema-p24.yml'
  pull_request:
    paths:
      - 'studio-cinema/p24/**'
      - '.github/workflows/ci-cinema-p24.yml'
  workflow_dispatch:
jobs:
  synthetic-encoded-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source numeric and graphics dependencies
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'opencv-python-headless>=4.9,<5'
      - name: P24 independent adversarial codec unit tests
        run: python -m unittest discover -s studio-cinema/p24/tests -p 'test_p24_unit.py' -v
      - name: P15–P21 original source regression
        run: node --test studio-cinema/p21/tests/test_p21.cjs studio-cinema/p20/tests/test_p20.cjs studio-cinema/p19/tests/test_p19.cjs studio-cinema/p15/tests/test_behavior_ontology.cjs
      - name: Generate verified synthetic P19-P21 controls
        run: node studio-cinema/p22/src/build_p22_controls.cjs studio-cinema/p22/results/controls.json
      - name: P22 and P23 pixel and temporal tests
        run: |
          python -m unittest discover -s studio-cinema/p22/tests -p 'test_p22_visual.py' -v
          python -m unittest discover -s studio-cinema/p23/tests -p 'test_p23_temporal.py' -v
      - name: Install free FFmpeg and verify H264 AAC encoders
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders | grep 'libx264'
          ffmpeg -hide_banner -encoders | grep -E '(^| )aac( |$)'
      - name: Render original P23 synthetic H264 AAC MOVIE
        run: |
          python studio-cinema/p23/src/temporal_blend.py --data studio-cinema/p22/results/controls.json --out studio-cinema/p24/results/proof --render-preview
      - name: Decode two authentic 480-frame H264 videos and compare P23 against P19
        run: |
          python studio-cinema/p24/src/p24_h264_audit.py             --data studio-cinema/p22/results/controls.json             --movie studio-cinema/p24/results/proof/P23_temporal_blend_synthetic_60fps.mp4             --out studio-cinema/p24/results/proof
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('studio-cinema/p24/results/proof/p24_h264_temporal_report.json')
          r=json.loads(p.read_text())
          assert r['status']=='synthetic_codec_measured'
          assert r['frames_compared']==480
          assert r['video_info']['aac_synthetic'] is True
          assert r['baseline_video_info']['aac_synthetic'] is False
          assert len(r['decoded_peak_visibility'])==4
          assert all(v['decoded_changed_pixels']>=1 for v in r['decoded_peak_visibility'].values())
          assert r['real_user_media_used'] is False
          assert r['production_integration_allowed'] is False
          assert r['safari_iphone_physically_tested'] is False
          print('P24 offline synthetic decoded evidence:',json.dumps({
             'peak_decoded_pixels':{k:v['decoded_changed_pixels'] for k,v in r['decoded_peak_visibility'].items()},
             'p95_extra_temporal_delta':r['p95_extra_temporal_delta_in_mouth'],
             'idle_encoded_residual':r['idle_decoded_delta_mean']
          }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-p24-h264-decoded-synthetic-report
          path: |
            studio-cinema/p24/results/proof/p24_h264_temporal_report.json
            studio-cinema/p24/results/proof/p23_temporal_qa.json
          if-no-files-found: error
          retention-days: 3
