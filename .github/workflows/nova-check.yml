name: NOVA - validation du prototype
on:
  push:
    branches:
      - chatgpt-studio-nova-v01
  pull_request:
    branches:
      - chatgpt-ai-director-v01
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nova-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unitaires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe du module et de l'interface
        run: |
          node --check experiences/nova-decision.js
          node --check experiences/nova-zones.js
          node --check experiences/nova-worker.js
          node --check experiences/nova-video.js
          node --check experiences/nova-timeline.js
          node --check experiences/nova-demux.js
          node --check experiences/nova-pts.js
          node --check experiences/nova-guard.js
          node --check experiences/nova-avsync.js
          node --check experiences/nova-aac-copy.js
          node --check experiences/nova-export.js
          node --check experiences/nova-export-ui.js
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('experiences/nova.html','utf8');const a=s.indexOf('<script>');const b=s.indexOf('</script>',a);if(a<0||b<0)throw Error('script absent');new vm.Script(s.slice(a+8,b));console.log('NOVA inline JS valid');"
      - name: Garde-fous NOVA
        run: node --test tests/nova-decision.test.mjs tests/nova-zones.test.mjs tests/nova-video.test.mjs tests/nova-demux.test.mjs tests/nova-timeline.test.mjs tests/nova-pts.test.mjs tests/nova-guard.test.mjs tests/nova-avsync.test.mjs tests/nova-aac-copy.test.mjs tests/nova-av-pulses.test.mjs tests/nova-export.test.mjs
  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
      - name: Préparer FFmpeg pour le test MP4 réel
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Test d'interface mobile et bureau avec Chromium
        run: |
          export CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME"
          node --test tests/nova-browser.test.mjs

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer WebKit et dépendances Linux (navigateur gratuit)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Vérifier FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Tester le vrai moteur WebKit Linux (ne remplace pas Safari iPhone)
        run: node --test tests/nova-webkit.test.mjs
